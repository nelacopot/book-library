services:
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: silo
    restart: unless-stopped

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: nelacopot
      MINIO_ROOT_PASSWORD: nelacopot

    volumes:
      - silo-data:/data

volumes:
  silo-data:
